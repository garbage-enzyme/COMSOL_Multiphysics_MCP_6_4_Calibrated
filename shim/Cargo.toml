[package]
name = "comsol-mcp-shim"
version = "0.1.0"
edition = "2021"
description = "Optional MCP stdio shim: manifest-backed discovery with a lazily spawned Python worker"
license = "MIT"
publish = false

[[bin]]
name = "comsol-mcp-shim"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
