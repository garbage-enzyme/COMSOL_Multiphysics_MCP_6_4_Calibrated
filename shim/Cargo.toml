[package]
name = "comsol-mcp-shim"
# Tracks the COMSOL MCP release line. The release batch bumps this together
# with comsol_mcp.__version__ in one commit; dev builds carry -dev suffixes.
version = "0.8.2-dev"
edition = "2024"
# rust-version is the frozen, verified toolchain only. The theoretical
# lower bound is 1.85 (the release that introduced edition 2024), but no
# build on any older toolchain is tested or claimed. The shim ships as
# prebuilt binaries; consumers never compile it.
rust-version = "1.99.1"
description = "Optional MCP stdio shim: manifest-backed discovery with a lazily spawned Python worker"
license = "MIT"
publish = false

[[bin]]
name = "comsol-mcp-shim"
path = "src/main.rs"

[dependencies]
# Exact versions are frozen by the committed Cargo.lock; the packaging
# batch records the lock hash in the shim build manifest.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

# G-EOF-01 controls: the same exe plays the fixture workers, so the
# default test harness (which owns argv) must stay off this target.
[[test]]
name = "eof_cleanup"
harness = false
