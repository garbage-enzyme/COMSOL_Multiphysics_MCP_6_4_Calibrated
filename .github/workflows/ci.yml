name: solver-free-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility-py315:
    name: Python 3.15 preview compatibility (not production)
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: "1.98.1"
      CARGO_BUILD_JOBS: "2"
      PYTHONUNBUFFERED: "1"
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # actions/setup-python v6.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.15.0-rc.2"
      - name: Verify source-build prerequisites
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path D:\mcp_tests\py315 | Out-Null
          $env:JAVA_HOME = $env:JAVA_HOME_17_X64
          "JAVA_HOME=$env:JAVA_HOME" >> $env:GITHUB_ENV
          rustup toolchain install 1.98.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc -Vv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ant -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $compiler = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $compiler) { throw "MSVC x64 build tools are required" }
          python -c "import sys, sysconfig; assert sys.version_info[:2] == (3, 15); assert not sysconfig.get_config_var('Py_GIL_DISABLED')"
      - name: Build exact source dependencies
        shell: pwsh
        run: |
          python -m pip --log D:\mcp_tests\py315\source-build.log wheel --no-deps --wheel-dir D:\mcp_tests\py315\wheels `
            "https://files.pythonhosted.org/packages/48/a2/5d27e81d24eef64668bf702bfe0e091cc48388b4666f36e025243eb9d827/jpype1-1.7.1.tar.gz#sha256=3cd88838dc3d2d546f7eaeadaaff864e590010c15f2b6a44b6f37e60796a14b2" `
            "https://files.pythonhosted.org/packages/af/f9/8a06bea35ef8daf588f707784c973a7046e0034c8d8cfb08828eeffb8b75/pydantic_core-2.46.5.tar.gz#sha256=10416c15b8839ecc4ef4d0885da76da6fd0f67333a0eb8aff6d93c4b8f2910fc" `
            "https://files.pythonhosted.org/packages/05/8e/961c0007c59b8dd7729d542c61a4d537767a59645b82a0b521206e1e25c2/pyyaml-6.0.3.tar.gz#sha256=d76623373421df22fb4cf8817020cbb7ef15c725b9d5e45f17e189bfc384190f"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem D:\mcp_tests\py315\wheels\*.whl | Get-FileHash -Algorithm SHA256 | ConvertTo-Json | Set-Content D:\mcp_tests\py315\wheel-hashes.json
      - name: Install preview dependencies and project
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: --find-links D:\mcp_tests\py315\wheels ".[dev,manuals]" "jpype1==1.7.1" "pyyaml==6.0.3" "pydantic==2.13.5"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip freeze --all > D:\mcp_tests\py315\installed.txt
      - name: Run preview solver-free regression and GUI tests
        shell: pwsh
        run: |
          python development_kit/scripts/serial_test_shards.py --basetemp-root D:\mcp_tests\py315main --shards 2 --ignore development_kit/tests/test_control_plane_startup.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q development_kit/tests/test_control_plane_startup.py --basetemp D:\mcp_tests\py315serial
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # PyMuPDF 1.28.2 uses typing.ByteString during import on Python 3.15.
          # Remove this exact third-party exception when upstream stops using it.
          python -m pytest -q -W error -W "ignore:'typing.ByteString' and 'collections.abc.ByteString' are deprecated and slated for removal in Python 3.17:DeprecationWarning:pymupdf:470" settings_gui/tests --basetemp D:\mcp_tests\py315gui
      - name: Build and verify an installed preview wheel
        shell: pwsh
        run: |
          python -m build --outdir D:\mcp_tests\py315\dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m venv D:\mcp_tests\py315env
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $previewPython = 'D:\mcp_tests\py315env\Scripts\python.exe'
          $wheel = (Get-ChildItem D:\mcp_tests\py315\dist\*.whl).FullName
          & $previewPython -m pip install --only-binary=:all: --find-links D:\mcp_tests\py315\wheels $wheel "jpype1==1.7.1" "pydantic==2.13.5"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $previewPython -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location D:\mcp_tests\py315
          try {
            & $previewPython "$env:GITHUB_WORKSPACE\development_kit\scripts\installed_package_probe.py" --snapshot-dir "$env:GITHUB_WORKSPACE\development_kit\tests\snapshots" --output D:\mcp_tests\py315\installed-package.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $previewPython "$env:GITHUB_WORKSPACE\development_kit\scripts\installed_stdio_probe.py" --command D:\mcp_tests\py315env\Scripts\comsol-mcp.exe --workdir D:\mcp_tests\py315stdio --output D:\mcp_tests\py315\installed-stdio.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
      - name: Upload preview receipts and failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python315-preview-evidence
          path: |
            D:\mcp_tests\py315
            D:\mcp_tests\py315main\*.log
            D:\mcp_tests\py315stdio\*.log
          if-no-files-found: warn

  dependency-compatibility:
    name: dependency compatibility (${{ matrix.lane }}, Python 3.14)
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lane: [minimum-supported, current-compatible]
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # actions/setup-python v6.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/minimum_supported_py314.txt
      - name: Install minimum-supported dependency lane
        if: matrix.lane == 'minimum-supported'
        run: python -m pip install --constraint constraints/minimum_supported_py314.txt ".[dev,manuals]"
      - name: Install current-compatible dependency lane
        if: matrix.lane == 'current-compatible'
        run: python -m pip install --upgrade --upgrade-strategy eager ".[dev,manuals]"
      - name: Verify resolved dependencies
        run: python -m pip check
      - name: Verify reviewed runtime dependency licenses
        run: python development_kit/scripts/dependency_license_gate.py --pyproject pyproject.toml --review development_kit/release/dependency_license_review.json --output "$env:RUNNER_TEMP\dependency-license-receipt.json"
      - name: Compile Python sources
        run: python -m compileall -q comsol_mcp src development_kit
      - name: Run dependency and process regression suite
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          New-Item -ItemType Directory -Force -Path D:\comsol_pytest | Out-Null
          python development_kit/scripts/serial_test_shards.py --basetemp-root D:\comsol_pytest\dependency-main --shards 2 --ignore development_kit/tests/test_control_plane_startup.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -u -m pytest -vv -o faulthandler_timeout=120 development_kit/tests/test_control_plane_startup.py --basetemp D:\comsol_pytest\dependency-serial
      - name: Upload dependency test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-test-evidence-${{ matrix.lane }}
          path: D:\comsol_pytest
          if-no-files-found: warn

  unit-and-package-py314:
    name: unit-and-package (Python 3.14, default production lane)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # actions/setup-python v6.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependency-only test environment
        run: python -m pip install ".[dev,manuals]"
      - name: Verify pip check
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q comsol_mcp src development_kit
      - name: Run ratcheted quality, coverage, license, and budget gates
        run: python development_kit/scripts/quality_gate.py --artifact-root "$env:RUNNER_TEMP\comsol_quality"
      - name: Upload quality gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-gate-evidence
          path: ${{ runner.temp }}/comsol_quality
          if-no-files-found: warn
      - name: Build wheel and source distribution
        run: python -m build
      - name: Probe a clean non-editable wheel install
        run: python development_kit/scripts/release_gate.py --skip-tests --allow-dirty --dependency-lock constraints/release_locked_py314.txt --artifact-root "$env:RUNNER_TEMP\comsol_release"

  integration-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # actions/setup-python v6.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14"
      - name: Validate sanitized real-COMSOL fixture contracts
        run: python -m pip install ".[dev]"
      - run: python -m pytest -q development_kit/tests/test_release_engineering.py

  locked-runtime-security:
    name: locked runtime vulnerability policy
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # actions/setup-python v6.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: constraints/release_locked_py314.txt
      - name: Install pinned audit tool
        run: python -m pip install "pip-audit==2.10.1"
      - name: Audit the exact locked runtime and apply review policy
        run: |
          python -m pip_audit --requirement constraints/release_locked_py314.txt --no-deps --format json --output pip-audit.json
          $auditExitCode = $LASTEXITCODE
          if ($auditExitCode -gt 1) { exit $auditExitCode }
          if (-not (Test-Path pip-audit.json)) { exit 1 }
          python development_kit/scripts/security_gate.py --report pip-audit.json --allowlist development_kit/release/vulnerability_allowlist.json --output security-receipt.json

  solver-free-settings-gui:
    name: Settings GUI, package, and installed entry
    permissions:
      contents: read
      actions: write
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # actions/setup-python v6.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          # Floating 3.14 can select a hosted toolcache with an incomplete
          # Tcl/Tk payload. Pin a fresh official patch for the real Tk tests.
          python-version: "3.14.7"
          cache: pip
      - name: Require a usable Tk runtime
        run: |
          python -c "import tkinter as tk; root = tk.Tk(); root.withdraw(); root.update_idletasks(); root.destroy()"
      - name: Install solver-free GUI development environment
        run: python -m pip install ".[dev,manuals]"
      - name: Verify dependency state
        run: python -m pip check
      - name: Require a solver-free process baseline
        run: |
          $forbidden = @('comsol-mcp', 'comsol-mcp-settings', 'COMSOL', 'comsolmphserver', 'java', 'javaw')
          $found = @(Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.ProcessName -in $forbidden })
          if ($found.Count -ne 0) { throw "solver-free GUI CI started with a forbidden process" }
      - name: Verify deterministic gettext outputs
        run: python development_kit/scripts/settings_gui_locales.py --check
      - name: Compile GUI and MCP bridge
        run: python -m compileall -q settings_gui comsol_mcp/settings_gui_handshake.py comsol_mcp/settings_gui_launcher.py comsol_mcp/tools/settings_gui.py
      - name: Check GUI formatting and lint
        run: |
          python -m ruff format --check settings_gui comsol_mcp/settings_gui_handshake.py comsol_mcp/settings_gui_launcher.py comsol_mcp/tools/settings_gui.py development_kit/scripts/installed_package_probe.py development_kit/scripts/settings_gui_icon.py development_kit/scripts/settings_gui_locales.py development_kit/scripts/settings_gui_package_probe.py development_kit/tests/test_settings_gui_root_launcher.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff check settings_gui comsol_mcp/settings_gui_handshake.py comsol_mcp/settings_gui_launcher.py comsol_mcp/tools/settings_gui.py development_kit/scripts/installed_package_probe.py development_kit/scripts/settings_gui_icon.py development_kit/scripts/settings_gui_locales.py development_kit/scripts/settings_gui_package_probe.py development_kit/tests/test_settings_gui_root_launcher.py
      - name: Run independent GUI and backend contract tests
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          New-Item -ItemType Directory -Force -Path D:\mcp_tests | Out-Null
          python -m pytest -q -W error settings_gui/tests --basetemp D:\mcp_tests\gui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q -W error development_kit/tests/test_alpha6_settings_gui_contract.py development_kit/tests/test_settings_gui_direct_entry.py development_kit/tests/test_settings_gui_launcher.py development_kit/tests/test_settings_gui_package.py development_kit/tests/test_settings_gui_root_launcher.py development_kit/tests/test_settings.py development_kit/tests/test_standalone_tools.py development_kit/tests/test_user_guides.py development_kit/tests/test_release_engineering.py --basetemp D:\mcp_tests\backend
      - name: Build wheel and source distribution
        run: python -m build
      - name: Inspect Settings GUI artifact membership
        run: python development_kit/scripts/settings_gui_package_probe.py --dist dist --output "$env:RUNNER_TEMP\settings-gui-package.json"
      - name: Probe clean non-editable installed package
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "settings-gui-installed"
          python -m venv $venv
          $python = Join-Path $venv "Scripts\python.exe"
          $wheel = (Get-ChildItem -LiteralPath dist -Filter *.whl).FullName
          & $python -m pip install $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location $env:RUNNER_TEMP
          try {
            & $python "$env:GITHUB_WORKSPACE\development_kit\scripts\installed_package_probe.py" --snapshot-dir "$env:GITHUB_WORKSPACE\development_kit\tests\snapshots" --output "$env:RUNNER_TEMP\settings-gui-installed.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
      - name: Prove no GUI, MCP, COMSOL, or Java process residue
        run: |
          $forbidden = @('comsol-mcp', 'comsol-mcp-settings', 'COMSOL', 'comsolmphserver', 'java', 'javaw')
          $found = @(Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.ProcessName -in $forbidden })
          if ($found.Count -ne 0) { throw "solver-free GUI CI left a forbidden process" }
      # actions/upload-artifact v7.0.1
      - name: Upload GUI package receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: settings-gui-receipts
          path: |
            ${{ runner.temp }}/settings-gui-package.json
            ${{ runner.temp }}/settings-gui-installed.json
            dist/*

# Real COMSOL tests are intentionally absent from hosted CI. Run the explicit,
# serial development_kit/scripts/run_real_release_gate.py gate on a licensed,
# version-pinned host.
# The Settings GUI job is also solver-free and never starts COMSOL, Java, MPh,
# or JPype.
